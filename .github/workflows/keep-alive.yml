name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render server to keep it warm
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://opencode-headless.onrender.com/doc || exit 1
        env:
          RENDER_URL: https://opencode-headless.onrender.com